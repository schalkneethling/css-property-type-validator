name: Upstream contract drift

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check pinned Ephemeral contract
        run: node scripts/check-ephemeral-contract.mjs

      - name: Detect Ephemeral upstream drift
        run: node scripts/check-ephemeral-drift.mjs

      - name: Detect official specification drift
        run: |
          node scripts/check-spec-links.mjs
          node scripts/check-spec-drift.mjs

      - name: Run synthetic Ephemeral canary
        run: node scripts/ephemeral-canary.mjs
