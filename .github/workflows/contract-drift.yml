name: Upstream contract drift

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Check pinned Ephemeral contract
        run: node scripts/check-ephemeral-contract.mjs

      - name: Detect Ephemeral upstream drift
        run: node scripts/check-ephemeral-drift.mjs

      - name: Detect official specification drift
        run: |
          node scripts/check-spec-links.mjs
          node scripts/check-spec-drift.mjs

      - name: Run synthetic Ephemeral canary
        run: node scripts/ephemeral-canary.mjs
