name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 22
          - 24

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Check acceptance traceability and repository boundaries
        if: matrix.node-version == 22
        run: |
          pnpm run acceptance:check
          pnpm run guardrails:core
          pnpm run guardrails:reads
          pnpm run guardrails:diagnostics
          pnpm run guardrails:generated
          pnpm run guardrails:release-order
          pnpm run guardrails:versions
          pnpm run ephemeral:contract:check
          pnpm run ephemeral:contract:generated-check
          pnpm run web:assert-release-boundary

      - name: Build packages and non-deployable future web lane
        run: pnpm run build

      - name: Install Chromium for published web and report contracts
        if: matrix.node-version == 22
        run: pnpm exec playwright install --with-deps chromium

      - name: Build web from the exact published core package
        if: matrix.node-version == 22
        run: pnpm run web:check-published-core
        env:
          CPTV_WEB_ARTIFACT_DIR: .artifacts/web-published

      - name: Upload published-consumer web artifact
        if: matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-published-consumer
          path: .artifacts/web-published
          if-no-files-found: error
          retention-days: 7

      - name: Test standalone report in the pinned sandbox
        if: matrix.node-version == 22
        run: pnpm run test:report:browser

      - name: Generate sanitized adoption audit report
        if: matrix.node-version == 22
        run: pnpm run report:ci

      - name: Upload sanitized adoption audit report
        if: matrix.node-version == 22
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: css-property-adoption-audit
          path: .artifacts/cptv-audit.html
          if-no-files-found: error
          retention-days: 7

  project-context-performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Enforce project-context performance budget
        run: pnpm --filter @schalkneethling/css-property-type-validator-project-context test:performance
