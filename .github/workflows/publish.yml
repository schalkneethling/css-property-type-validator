name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm run build

  pack:
    name: Pack packages
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build

      - name: Create package directory
        run: mkdir package

      - name: Pack core package
        run: pnpm --filter @schalkneethling/css-property-type-validator-core pack --pack-destination package

      - name: Pack CLI package
        run: pnpm --filter @schalkneethling/css-property-type-validator-cli pack --pack-destination package

      - name: Pack Stylelint package
        run: pnpm --filter @schalkneethling/stylelint-plugin-css-property-type-validator pack --pack-destination package

      - name: Upload package tarballs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-packages
          path: package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Publish uses Node 24.8.0 only so npm is new enough for OIDC trusted
          # publishing. The tarballs are already built and tested on .nvmrc.
          node-version: 24.8.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Ensure npm is new enough for trusted publishing
        run: |
          required="11.5.1"
          current="$(npm --version)"
          CURRENT="$current" REQUIRED="$required" node -e "
            const parse = (value) => value.split('.').map(Number);
            const [major, minor, patch] = parse(process.env.CURRENT);
            const [requiredMajor, requiredMinor, requiredPatch] = parse(process.env.REQUIRED);
            const ok =
              major > requiredMajor ||
              (major === requiredMajor && minor > requiredMinor) ||
              (major === requiredMajor && minor === requiredMinor && patch >= requiredPatch);
            process.exit(ok ? 0 : 1);
          " || npm install -g npm@latest
          npm --version

      - name: Download package tarballs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-packages
          path: package

      - name: Publish selected packages
        run: |
          tag="${GITHUB_REF_NAME}"

          publish_matching() {
            pattern="$1"
            dist_tag="${2:-}"
            tarball="$(find package -type f -name "$pattern" -print -quit)"

            if [ -z "$tarball" ]; then
              echo "No tarball found for pattern $pattern."
              find package -maxdepth 2 -type f -print
              exit 1
            fi

            publish_args=(publish "$(realpath "$tarball")" --ignore-scripts --access public)

            if [ -n "$dist_tag" ]; then
              publish_args+=(--tag "$dist_tag")
            fi

            npm "${publish_args[@]}"
          }

          case "$tag" in
            core-v*)
              publish_matching "schalkneethling-css-property-type-validator-core-*.tgz"
              ;;
            cli-v*)
              publish_matching "schalkneethling-css-property-type-validator-cli-*.tgz"
              ;;
            stylelint-v*)
              publish_matching "schalkneethling-stylelint-plugin-css-property-type-validator-*.tgz" beta
              ;;
            all-v*)
              publish_matching "schalkneethling-css-property-type-validator-core-*.tgz"
              publish_matching "schalkneethling-css-property-type-validator-cli-*.tgz"
              publish_matching "schalkneethling-stylelint-plugin-css-property-type-validator-*.tgz" beta
              ;;
            *)
              echo "Release tag must start with core-v, cli-v, stylelint-v, or all-v."
              exit 1
              ;;
          esac
